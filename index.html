<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#D8F1EA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F2A2E" media="(prefers-color-scheme: dark)">
<meta name="referrer" content="no-referrer">
<meta name="format-detection" content="telephone=no">
<title>Footholds – tiny wins for busy brains</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600&family=Unbounded:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#D8F1EA; --surface:#FFFFFF; --sunk:#BFE6DB; --ink:#14213D; --muted:#3E4C66; --line:#14213D;
  --c-grape:#A98BFF; --c-tangerine:#FF8B6B; --c-lagoon:#2FC1D3; --c-bubblegum:#FF7AA8; --c-sky:#6AA8FF; --c-lemon:#FFCB57;
  --accent:#FF8B6B; --accent-ink:#14213D; --pop:#FFCB57; --pop-ink:#14213D; --danger:#D23A4F;
  --b:2.5px solid var(--line); --shadow:4px 4px 0 var(--line); --shadow-sm:3px 3px 0 var(--line);
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  --display:"Unbounded","Arial Black","Segoe UI",system-ui,sans-serif;
  --body:"Lexend","Verdana",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F2A2E; --surface:#173C42; --sunk:#1F4C53; --ink:#E6FAF4; --muted:#B5D6CE; --line:#E6FAF4;
    --danger:#FF7A8C; --shadow:4px 4px 0 #000; --shadow-sm:3px 3px 0 #000; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F2A2E; --surface:#173C42; --sunk:#1F4C53; --ink:#E6FAF4; --muted:#B5D6CE; --line:#E6FAF4;
  --danger:#FF7A8C; --shadow:4px 4px 0 #000; --shadow-sm:3px 3px 0 #000; color-scheme:dark;
}
:root[data-palette="sunset"]{--accent:#FF7AA8;--pop:#FFCB57}
:root[data-palette="ocean"]{--accent:#6AA8FF;--pop:#2FC1D3}
:root[data-palette="neon"]{--accent:#A98BFF;--pop:#C6F432}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden;
  background-image:radial-gradient(color-mix(in srgb,var(--ink) 13%,transparent) 1.2px,transparent 1.3px);background-size:22px 22px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
a{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.habit-open,.habit-name,.tiny-line,.coach-out,.cal-item span,.peer-task{overflow-wrap:anywhere}
:focus-visible{outline:3px solid var(--c-sky);outline-offset:3px;border-radius:10px}
main{max-width:620px;margin:0 auto;padding:18px 16px 130px}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0}
h1{font-size:2rem;font-weight:800;letter-spacing:-0.02em}
h2{font-size:1.25rem;font-weight:700}
h3{font-size:1rem;font-weight:700}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:.88rem}
.stack>*+*{margin-top:16px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:22px}
.top-right{display:flex;gap:8px;align-items:center}
.brand{font-family:var(--display);font-weight:800;font-size:1rem;display:flex;align-items:center;gap:8px}
.brand-mark{display:flex;gap:3px;align-items:flex-end}
.brand-mark i{width:8px;border-radius:2px;border:2px solid var(--line)}
.brand-mark i:nth-child(1){height:11px;background:var(--c-tangerine)}.brand-mark i:nth-child(2){height:17px;background:var(--c-lemon)}.brand-mark i:nth-child(3){height:23px;background:var(--c-lagoon)}
.pill{font-size:.8rem;padding:4px 11px;border-radius:999px;border:var(--b);background:var(--surface);font-weight:600;white-space:nowrap;box-shadow:var(--shadow-sm)}
.pill:active{transform:translate(2px,2px);box-shadow:none}
.pill.plus{background:var(--pop);color:var(--pop-ink)}
.pill.lvl{background:var(--accent);color:var(--accent-ink)}

.hero{margin-bottom:20px} .hero p{margin-top:6px}
.hero h1{display:inline;background:linear-gradient(transparent 62%,var(--c-lemon) 62%,var(--c-lemon) 92%,transparent 92%);box-decoration-break:clone;-webkit-box-decoration-break:clone}
.battery{margin-top:18px;background:var(--surface);border:var(--b);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.battery-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.battery-count{font-family:var(--display);font-weight:800;font-size:1.4rem}
.cells{display:flex;gap:6px;margin-top:12px;height:36px;padding:4px;border:var(--b);border-radius:12px;position:relative}
.cells::after{content:"";position:absolute;right:-9px;top:50%;width:6px;height:14px;transform:translateY(-50%);background:var(--line);border-radius:0 3px 3px 0}
.cell{flex:1;border-radius:6px;background:var(--sunk);position:relative;overflow:hidden}
.cell i{position:absolute;inset:0;transform:scaleY(0);transform-origin:bottom;transition:transform .45s cubic-bezier(.3,1.6,.5,1)}
.cell.full i{transform:scaleY(1)} .cell.tiny i{transform:scaleY(.5)}
.battery.all{animation:wiggle .6s ease-in-out}
@keyframes wiggle{20%{transform:rotate(-1.5deg)}40%{transform:rotate(1.5deg)}60%{transform:rotate(-1deg)}80%{transform:rotate(.5deg)}}

.energy{background:var(--surface);border:var(--b);border-radius:18px;padding:16px;margin:0 0 26px;box-shadow:var(--shadow)}
.energy-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.energy-btn{border:var(--b);background:var(--surface);border-radius:14px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:600;font-size:.88rem;box-shadow:var(--shadow-sm);transition:transform .1s,box-shadow .1s}
.energy-btn .em{font-size:1.7rem;line-height:1}
.energy-btn:active{transform:translate(2px,2px);box-shadow:none}
.energy-btn[aria-pressed="true"]{background:var(--c-lemon);color:#14213D;transform:translate(2px,2px);box-shadow:none}

.section-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:6px 0 14px}
.habits{display:flex;flex-direction:column;gap:14px}
.habit{--hc:var(--c-grape);display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px;border-radius:18px;background:var(--surface);border:var(--b);box-shadow:var(--shadow);transition:background .25s}
.habit.is-full{background:color-mix(in srgb,var(--hc) 38%,var(--surface))}
.habit.is-tiny{background:color-mix(in srgb,var(--hc) 18%,var(--surface))}
.habit.later{opacity:.6;box-shadow:none;border-style:dashed}
.emoji{width:50px;height:50px;border-radius:14px;display:grid;place-items:center;font-size:1.6rem;background:var(--hc);border:var(--b);transform:rotate(-4deg)}
.habit:nth-child(even) .emoji{transform:rotate(3deg)}
.habit-open{background:none;border:0;padding:0;text-align:left;width:100%;min-width:0}
.habit-name{font-weight:600;font-size:1.05rem}
.habit-meta{font-size:.82rem;color:var(--muted);margin-top:4px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.mini{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:1px 9px;font-size:.78rem;font-weight:600;color:var(--ink)}
.mini:active{background:var(--hc,var(--accent))}
.habit-actions{display:flex;flex-direction:column;align-items:center;gap:6px}
.check{width:52px;height:52px;border-radius:14px;border:var(--b);background:var(--surface);display:grid;place-items:center;box-shadow:var(--shadow-sm);transition:transform .1s,box-shadow .1s,background .2s}
.check svg{width:26px;height:26px;opacity:0;transform:scale(.3) rotate(-20deg);transition:opacity .15s,transform .3s cubic-bezier(.3,1.8,.5,1)}
.check svg path{stroke:#14213D}
.check.full{background:var(--hc);transform:translate(2px,2px);box-shadow:none}
.check.full svg{opacity:1;transform:scale(1) rotate(0)}
.check:active{transform:translate(2px,2px);box-shadow:none}
.check.pop{animation:pop .35s cubic-bezier(.3,1.8,.5,1)}
@keyframes pop{0%{transform:translate(2px,2px) scale(.85)}60%{transform:translate(2px,2px) scale(1.15)}100%{transform:translate(2px,2px) scale(1)}}
.tiny-btn{border:2px dashed var(--line);background:transparent;border-radius:999px;padding:2px 9px;font-size:.74rem;font-weight:600;white-space:nowrap}
.tiny-btn[aria-pressed="true"]{border-style:solid;background:var(--hc);color:#14213D}
.tiny-line{font-size:.86rem;color:var(--muted);margin-top:2px}
.steps{grid-column:1 / -1;margin:2px 0 0;padding:10px 12px 10px 32px;font-size:.9rem;background:var(--sunk);border:2px dashed var(--line);border-radius:12px}
.steps li+li{margin-top:2px}
.later-note{font-size:.92rem;color:var(--muted);margin:26px 0 12px}

.btn{border:var(--b);border-radius:14px;padding:11px 18px;font-weight:600;background:var(--ink);color:var(--bg);box-shadow:var(--shadow-sm);transition:transform .1s,box-shadow .1s}
.btn:active{transform:translate(3px,3px);box-shadow:none}
.btn.secondary{background:var(--surface);color:var(--ink)}
.btn.accent{background:var(--accent);color:var(--accent-ink)}
.btn.pop{background:var(--pop);color:var(--pop-ink)}
.btn:disabled{opacity:.5;cursor:default;transform:none;box-shadow:var(--shadow-sm)}
.btn.block{width:100%}
.link{background:none;border:0;color:var(--ink);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px;padding:0;font-weight:600}
.row-end{margin-top:22px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}

.empty{background:var(--surface);border:var(--b);border-radius:18px;padding:22px;box-shadow:var(--shadow)}
.starter{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:16px}
.starter button{--hc:var(--c-grape);border:var(--b);background:var(--surface);border-radius:14px;padding:11px;text-align:left;display:flex;gap:10px;align-items:center;font-weight:600;box-shadow:var(--shadow-sm)}
.starter button span{font-size:1.3rem;width:34px;height:34px;display:grid;place-items:center;border-radius:10px;background:var(--hc);border:2px solid var(--line);flex:none}
.starter button:active{transform:translate(2px,2px);box-shadow:none}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.88rem;margin:18px 0 4px}
.or::before,.or::after{content:"";flex:1;border-top:2px dashed var(--line)}

.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.chip{border:var(--b);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;font-size:.92rem;box-shadow:var(--shadow-sm)}
.chip[aria-pressed="true"]{background:var(--c-lemon);color:#14213D;transform:translate(2px,2px);box-shadow:none}
.ob-progress{display:flex;gap:6px;margin:14px 0 22px}
.ob-progress i{flex:1;height:12px;border-radius:6px;border:2px solid var(--line);background:var(--surface)}
.ob-progress i.on{background:var(--c-lagoon)}
.preview{--hc:var(--c-grape);display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:18px;background:var(--surface);border:var(--b);box-shadow:var(--shadow)}
.preview .emoji{width:44px;height:44px;font-size:1.3rem;flex:none}

.card{background:var(--surface);border:var(--b);border-radius:18px;padding:18px;box-shadow:var(--shadow)}
.card.hc{--hc:var(--c-grape)}
.card-title{display:flex;align-items:center;gap:10px}
.card-title .emoji{width:40px;height:40px;font-size:1.2rem;border-radius:12px}
.dots{display:grid;grid-template-columns:repeat(14,1fr);gap:5px;margin-top:14px}
.dot{aspect-ratio:1;border-radius:5px;border:2px solid color-mix(in srgb,var(--line) 35%,transparent);background:transparent}
.dot.full{background:var(--hc,var(--c-grape));border-color:var(--line)}
.dot.tiny{background:linear-gradient(to top,var(--hc,var(--c-grape)) 50%,transparent 50%);border-color:var(--line)}
.dot.grace{background:repeating-linear-gradient(45deg,var(--c-lemon) 0 3px,var(--surface) 3px 6px);border-color:var(--line)}
.dot.today{outline:2.5px solid var(--c-tangerine);outline-offset:2px}
.stat-row{display:flex;gap:26px;margin-top:12px;font-size:.88rem;color:var(--muted);flex-wrap:wrap}
.stat-row b{font-family:var(--display);font-size:1.25rem;color:var(--ink);display:block}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:.84rem;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .dot{width:15px;display:inline-block}
.bar-row{display:grid;grid-template-columns:118px 1fr 48px;gap:10px;align-items:center;margin-top:10px;font-size:.9rem}
.bar{height:16px;background:var(--surface);border:2px solid var(--line);border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-right:2px solid var(--line)}
.locked{position:relative}
.locked .blur{filter:blur(6px);pointer-events:none;user-select:none}
.locked .lock-msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:16px}

.level-card{background:var(--accent);color:#14213D;border:var(--b);border-radius:18px;padding:20px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.level-card::after{content:"★";position:absolute;right:-6px;top:-22px;font-size:7rem;opacity:.18;transform:rotate(14deg)}
.level-card>*{position:relative;z-index:1}
.level-num{font-family:var(--display);font-weight:800;font-size:3rem;line-height:1}
.xp-bar{height:18px;border-radius:9px;background:#FFFFFF;border:2.5px solid #14213D;overflow:hidden;margin-top:12px}
.xp-bar i{display:block;height:100%;background:repeating-linear-gradient(45deg,#14213D 0 6px,#2E3E5E 6px 12px);transition:width .6s}
.unlocks{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:14px}
.unlock{border:var(--b);background:var(--surface);border-radius:14px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:2px;font-weight:600;box-shadow:var(--shadow-sm)}
.unlock .ue{font-size:1.5rem}
.unlock[aria-pressed="true"]{background:var(--c-lemon);color:#14213D;transform:translate(2px,2px);box-shadow:none}
.unlock[aria-pressed="true"] small{color:#3E4C66}
.unlock:disabled{opacity:.55;cursor:default;box-shadow:none;border-style:dashed}
.unlock small{font-weight:400;color:var(--muted)}

.timer-wrap{display:flex;flex-direction:column;align-items:center;gap:14px;padding:10px 0}
.ring{width:min(240px,70vw);height:min(240px,70vw);position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:18}
.ring .track{stroke:var(--sunk)}
.ring .prog{stroke:var(--hc,var(--accent));transition:stroke-dashoffset 1s linear}
.ring::before{content:"";position:absolute;inset:0;border-radius:50%;border:2.5px solid var(--line)}
.ring::after{content:"";position:absolute;inset:16%;border-radius:50%;border:2.5px solid var(--line)}
.ring-label{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:1}
.ring-time{font-family:var(--display);font-weight:800;font-size:2.6rem;font-variant-numeric:tabular-nums;line-height:1}
.peers{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.peer{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;border:2px solid var(--line);background:var(--sunk)}
.peer .pe{font-size:1.6rem}
.peer .pinfo{flex:1;min-width:0}
.peer-name{font-weight:600}
.peer-task{font-size:.84rem;color:var(--muted)}
.cheer-btn{border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:5px 9px;font-size:1.15rem;box-shadow:2px 2px 0 var(--line)}
.cheer-btn:active{transform:translate(2px,2px);box-shadow:none}
.toggle{display:flex;align-items:center;gap:10px;font-weight:600;margin-top:12px;cursor:pointer}
.toggle input{width:22px;height:22px;accent-color:var(--c-lagoon)}

.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.kpi{background:var(--surface);border:var(--b);border-radius:16px;padding:14px;box-shadow:var(--shadow-sm)}
.kpi:nth-child(3n+1){background:color-mix(in srgb,var(--c-lagoon) 30%,var(--surface))}
.kpi:nth-child(3n+2){background:color-mix(in srgb,var(--c-lemon) 35%,var(--surface))}
.kpi:nth-child(3n){background:color-mix(in srgb,var(--c-grape) 30%,var(--surface))}
.kpi b{display:block;font-family:var(--display);font-size:1.6rem;font-weight:800;line-height:1.1}
.kpi span{font-size:.84rem;color:var(--muted)}
.funnel .bar-row{grid-template-columns:130px 1fr 48px}
.econ{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.econ label{font-size:.84rem}
.econ-out{margin-top:14px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.econ-out>div{border:2px solid var(--line);border-radius:12px;padding:8px 4px;background:var(--sunk)}
.econ-out b{display:block;font-family:var(--display);font-size:1.1rem}
.econ-out span{font-size:.78rem;color:var(--muted)}

.coach-out{white-space:pre-wrap;background:var(--sunk);border:2px dashed var(--line);border-radius:14px;padding:16px;margin-top:12px;min-height:3em}
textarea,input[type=text],input[type=time],input[type=number],select{width:100%;border:var(--b);background:var(--surface);border-radius:12px;padding:10px 12px}
textarea:focus,input:focus,select:focus{box-shadow:var(--shadow-sm);outline:none}
textarea{resize:vertical;min-height:84px}
label{display:block;font-weight:600;margin-bottom:6px}
.field+.field{margin-top:16px}
.hint{font-size:.84rem;color:var(--muted);font-weight:400;display:block}
.bigemoji{font-size:2rem;line-height:1}

.plans{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:480px){.plans{grid-template-columns:1fr}}
.plan{background:var(--surface);border:var(--b);border-radius:18px;padding:18px;box-shadow:var(--shadow)}
.plan.current{outline:3px dashed var(--line);outline-offset:5px}
.plan.plus-card{background:var(--c-lagoon);color:#14213D}
.plan.plus-card .muted{color:#2A3550}
.price{font-family:var(--display);font-size:1.9rem;font-weight:800;margin:6px 0}
.plan ul{padding-left:0;list-style:none;margin:10px 0 16px;font-size:.93rem}
.plan li+li{margin-top:6px}
.demo-note{font-size:.84rem;color:var(--muted);margin-top:16px}

.cal-list{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.cal-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--sunk)}
.cal-link{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--ink);text-decoration:none;border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:5px 12px;font-size:.86rem;white-space:nowrap;box-shadow:2px 2px 0 var(--line)}
.cal-link:active{transform:translate(2px,2px);box-shadow:none}

nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:var(--b);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
nav.tabs .in{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:6px 6px 4px}
nav.tabs button{background:none;border:2px solid transparent;border-radius:12px;padding:5px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:.72rem;color:var(--muted);font-weight:600}
nav.tabs .ti{font-size:1.25rem;line-height:1.3;filter:grayscale(1);opacity:.7}
nav.tabs button[aria-current="page"]{color:#14213D;background:var(--c-lemon);border-color:var(--line)}
nav.tabs button[aria-current="page"] .ti{filter:none;opacity:1}

dialog{border:var(--b);border-radius:20px;padding:0;max-width:520px;width:calc(100% - 24px);max-height:calc(100% - 40px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow-y:auto;overscroll-behavior:contain;background:var(--surface);color:var(--ink);box-shadow:6px 6px 0 var(--line)}
dialog::backdrop{background:rgba(20,33,61,.55)}
.modal-in{padding:22px}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:22px;flex-wrap:wrap}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg button{border:var(--b);background:var(--surface);border-radius:12px;padding:8px 4px;font-size:.86rem;font-weight:600;box-shadow:var(--shadow-sm)}
.seg button[aria-pressed="true"]{background:var(--c-lemon);color:#14213D;transform:translate(2px,2px);box-shadow:none}
.picker{display:flex;flex-wrap:wrap;gap:8px}
.picker button{width:42px;height:42px;border-radius:12px;border:2px solid color-mix(in srgb,var(--line) 35%,transparent);background:var(--surface);font-size:1.3rem;display:grid;place-items:center}
.picker button[aria-pressed="true"]{border:var(--b);background:var(--c-lemon);box-shadow:var(--shadow-sm)}
.swatch{border:var(--b)!important}
.swatch[aria-pressed="true"]{box-shadow:var(--shadow-sm);transform:rotate(-6deg) scale(1.08)}

@media (max-width:420px){
  main{padding:14px 12px 120px}
  h1{font-size:1.55rem} h2{font-size:1.12rem}
  .habit{gap:10px;padding:10px}
  .emoji{width:42px;height:42px;font-size:1.3rem;border-radius:12px}
  .check{width:48px;height:48px}
  .energy-btn{font-size:.76rem;padding:10px 4px;line-height:1.2}
  .energy-btn .em{font-size:1.5rem}
  .battery-top{flex-direction:column;align-items:flex-start;gap:2px}
  .bar-row,.funnel .bar-row{grid-template-columns:96px 1fr 44px;font-size:.84rem}
  .dots{gap:3px} .dot{border-radius:4px;border-width:1.5px}
  .stat-row{gap:18px}
  .modal-in{padding:18px}
  .time-row,.econ{grid-template-columns:1fr!important}
  .starter{grid-template-columns:1fr}
  .modal-actions .btn{flex:1}
  nav.tabs button{font-size:.66rem}
  .brand{font-size:.9rem}
  .pill{padding:3px 8px;font-size:.74rem}
  .ring-time{font-size:2.2rem}
}
@media (max-width:340px){.habit{grid-template-columns:1fr auto}.habit .emoji{display:none}.top .brand span+span{display:none}}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translate(-50%,10px) rotate(-1deg);background:var(--c-lemon);color:#14213D;border:var(--b);box-shadow:var(--shadow-sm);padding:10px 16px;border-radius:14px;font-weight:600;font-size:.93rem;z-index:30;opacity:0;transition:opacity .2s,transform .25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0) rotate(-1deg)}
.saved{font-size:.8rem;color:var(--muted)}
.confetti{position:fixed;width:10px;height:10px;border-radius:2px;border:1.5px solid #14213D;pointer-events:none;z-index:40;animation:fly .8s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.confetti{display:none}}
</style>
</head>
<body>
<main id="app"></main>

<nav class="tabs" aria-label="Sections"><div class="in">
  <button data-tab="today" aria-current="page"><span class="ti" aria-hidden="true">🎯</span>Today</button>
  <button data-tab="progress"><span class="ti" aria-hidden="true">🔥</span>Wins</button>
  <button data-tab="focus"><span class="ti" aria-hidden="true">⏱️</span>Focus</button>
  <button data-tab="coach"><span class="ti" aria-hidden="true">🧠</span>Buddy</button>
  <button data-tab="plans"><span class="ti" aria-hidden="true">🚀</span>Level up</button>
</div></nav>

<dialog id="habitDlg"><div class="modal-in" id="habitForm"></div></dialog>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const keyOf = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today = () => keyOf(new Date());
const daysAgo = n => { const d=new Date(); d.setHours(12,0,0,0); d.setDate(d.getDate()-n); return d; };
const dayDiff = (a,b) => Math.round((new Date(b+"T12:00:00") - new Date(a+"T12:00:00"))/86400000);
const weekKey = d => { const x=new Date(d); x.setHours(12,0,0,0); x.setDate(x.getDate()-((x.getDay()+6)%7)); return keyOf(x); };
const uid = () => Math.random().toString(36).slice(2,10);
const pick = a => a[Math.floor(Math.random()*a.length)];
const has = (o,k) => Object.prototype.hasOwnProperty.call(o,k);
const num = (v,max) => Number.isFinite(+v) ? Math.max(0,Math.min(max,Math.floor(+v))) : 0;

const ENERGY = {1:{em:"🪫",label:"Running on fumes",short:"Fumes"},2:{em:"🔋",label:"Cruising",short:"Cruising"},3:{em:"⚡",label:"Zoomies",short:"Zoomies"}};
const EFFORT = {1:"Easy peasy",2:"Some effort",3:"Big lift"};
const WHEN = {morning:"Morning",afternoon:"Afternoon",evening:"Evening",any:"Whenever"};
const DEFAULT_TIME = {morning:"08:00",afternoon:"14:00",evening:"19:00",any:"09:00"};
const COLORS = ["grape","tangerine","lagoon","bubblegum","sky","lemon"];
const EMOJIS = ["💊","💧","🧹","📝","🏃","📥","🛏️","🥗","🧘","📚","🦷","🐶","🌱","🎸","💻","☀️"];
const EMOJIS_FUN = ["🦄","🎮","🍕","🎨","🪴","🧁"];
const ALL_EMOJIS = EMOJIS.concat(EMOJIS_FUN,["✨"]);
const FREE_COACH = 3, FREE_HABITS = 5;
const PTS = {full:10, tiny:6, focus:15}, PER_LEVEL = 100;
const UNLOCKS = [
  {lvl:1,type:"theme",id:"classic",label:"Coral",em:"🪸"},
  {lvl:2,type:"theme",id:"sunset",label:"Berry",em:"🍓"},
  {lvl:3,type:"emoji",id:"fun",label:"Party emoji",em:"🦄"},
  {lvl:4,type:"theme",id:"ocean",label:"Lagoon",em:"🌊"},
  {lvl:6,type:"theme",id:"neon",label:"Electric",em:"⚡"}];
const ANIMALS = [["🦦","Otter"],["🦊","Fox"],["🐼","Panda"],["🦉","Owl"],["🐢","Turtle"],["🐙","Octopus"],["🦄","Unicorn"],["🐝","Bee"]];
const ADJ = ["Focused","Sparkly","Brave","Cozy","Turbo","Chill","Mighty","Zippy"];
const ANIMAL_EM = ANIMALS.map(a=>a[0]);

let toastT;
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),2600); }
function confetti(el,color){
  if(!el || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const r=el.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2;
  const cols=[color,"var(--pop)","var(--c-bubblegum)","var(--c-sky)","var(--c-lagoon)"];
  for(let i=0;i<16;i++){
    const p=document.createElement("i"); p.className="confetti";
    const a=Math.random()*Math.PI*2, d=40+Math.random()*60;
    p.style.left=cx+"px"; p.style.top=cy+"px"; p.style.background=cols[i%cols.length];
    p.style.setProperty("--dx",Math.cos(a)*d+"px"); p.style.setProperty("--dy",Math.sin(a)*d-20+"px"); p.style.setProperty("--r",(Math.random()*540)+"deg");
    document.body.appendChild(p); setTimeout(()=>p.remove(),850);
  }
}

// ================= state, validation, storage =================
const LS_KEY="footholds:v1";
const LIM={name:80,tiny:100,step:120,steps:4,habits:50,logDays:400};
const ID_RE=/^[a-z0-9]{4,16}$/, DK_RE=/^\d{4}-\d{2}-\d{2}$/, TIME_RE=/^([01]\d|2[0-3]):[0-5]\d$/;
const str=(v,n)=>(typeof v==="string"?v:"").replace(/[\u0000-\u001f\u007f\u202a-\u202e\u2066-\u2069]/g," ").replace(/\s+/g," ").trim().slice(0,n);
const blank=()=>({habits:[],logs:{},energy:{},plus:false,coach:{},created:today(),focusCount:0,focusMins:0,theme:"classic",nick:"",nickEm:"🦦",shareTask:false,
  m:{firstSeen:today(),lastSeen:today(),coachTotal:0,aiOnboard:0,calClicks:0,roomJoins:0,hitLimit:0,upgradedAt:""}});
let S=blank();
let ready=false, storeMode="local", docRef=null, statsRef=null, saving=false, pendingSave=false, saveT, localDirty=false, retryCount=0, lastStats="";
let sample=null, db=null, user=null, isOwner=false, roomApi=null;

function cleanHabit(h,i){
  if(!h||typeof h!=="object") return null;
  const when=has(WHEN,h.when)?h.when:"any";
  return {id:ID_RE.test(h.id)?h.id:uid(), name:str(h.name,LIM.name)||"Untitled habit", tiny:str(h.tiny,LIM.tiny),
    emoji:ALL_EMOJIS.includes(h.emoji)?h.emoji:"✨", color:COLORS.includes(h.color)?h.color:COLORS[(i||0)%COLORS.length],
    energy:[1,2,3].includes(+h.energy)?+h.energy:2, when, time:TIME_RE.test(h.time)?h.time:DEFAULT_TIME[when],
    steps:Array.isArray(h.steps)?h.steps.slice(0,LIM.steps).map(s=>str(s,LIM.step)).filter(Boolean):[],
    created:DK_RE.test(h.created)?h.created:(S.created||today())};
}
function normalize(){
  const src=(S&&typeof S==="object")?S:{}; const out=blank();
  out.created=DK_RE.test(src.created)?src.created:today(); S=out;
  const seen=new Set();
  out.habits=(Array.isArray(src.habits)?src.habits:[]).slice(0,LIM.habits).map(cleanHabit).filter(h=>h&&!seen.has(h.id)&&seen.add(h.id));
  const cutoff=keyOf(daysAgo(LIM.logDays));
  if(src.logs&&typeof src.logs==="object") for(const [dk,v] of Object.entries(src.logs)){
    if(!DK_RE.test(dk)||dk<cutoff||!v||typeof v!=="object") continue;
    const day={}; for(const [hid,st] of Object.entries(v)) if(seen.has(hid)&&(st==="full"||st==="tiny")) day[hid]=st;
    if(Object.keys(day).length) out.logs[dk]=day;
  }
  if(src.energy&&typeof src.energy==="object") for(const [dk,e] of Object.entries(src.energy)) if(DK_RE.test(dk)&&dk>=cutoff&&[1,2,3].includes(+e)) out.energy[dk]=+e;
  if(src.coach&&typeof src.coach==="object") for(const [wk,n] of Object.entries(src.coach)) if(DK_RE.test(wk)&&wk>=cutoff) out.coach[wk]=num(n,999);
  out.plus=src.plus===true;
  out.focusCount=num(src.focusCount,1e6); out.focusMins=num(src.focusMins,1e7);
  out.theme=UNLOCKS.some(u=>u.type==="theme"&&u.id===src.theme)?src.theme:"classic";
  out.nick=str(src.nick,24); out.nickEm=ANIMAL_EM.includes(src.nickEm)?src.nickEm:"🦦"; out.shareTask=src.shareTask===true;
  const m=(src.m&&typeof src.m==="object")?src.m:{};
  out.m={firstSeen:DK_RE.test(m.firstSeen)?m.firstSeen:out.created, lastSeen:today(), coachTotal:num(m.coachTotal,1e6), aiOnboard:num(m.aiOnboard,1),
    calClicks:num(m.calClicks,1e6), roomJoins:num(m.roomJoins,1e6), hitLimit:num(m.hitLimit,1), upgradedAt:DK_RE.test(m.upgradedAt)?m.upgradedAt:""};
  if(!out.nick){ const a=pick(ANIMALS); out.nick=pick(ADJ)+" "+a[1]; out.nickEm=a[0]; }
}
function loadLocal(){ try{ const r=localStorage.getItem(LS_KEY); if(r) S=JSON.parse(r); }catch(e){ S=blank(); } normalize(); }
function writeLocal(){ try{ localStorage.setItem(LS_KEY,JSON.stringify(S)); }catch(e){} }
function save(){ localDirty=true; clearTimeout(saveT); saveT=setTimeout(flush,400); }
async function flush(){
  if(storeMode!=="db"||!docRef){ writeLocal(); return; }
  if(saving){ pendingSave=true; return; }
  saving=true;
  try{ await docRef.set(JSON.parse(JSON.stringify(S))); retryCount=0; await writeStats(); }
  catch(e){
    const code=e&&e.code;
    if((code==="unavailable"||code==="resource_exhausted")&&retryCount<3){ retryCount++; setTimeout(flush,1500*retryCount+Math.random()*800); }
    else { storeMode="local"; docRef=null; writeLocal(); toast(code==="quota_exceeded"?"Cloud storage is full – saving on this device for now.":"Sync hiccup – saving on this device for now."); render(); }
  }
  saving=false;
  if(pendingSave){ pendingSave=false; flush(); }
}
// Anonymous, aggregate-only usage stats for the founder dashboard: numbers, never habit names or text.
function statsDoc(){
  let wins=0,tiny=0,days=0;
  for(const dk in S.logs){ const v=Object.values(S.logs[dk]); if(v.length) days++; v.forEach(s=>s==="full"?wins++:tiny++); }
  return {v:1, firstSeen:S.m.firstSeen, lastSeen:S.m.lastSeen, habits:S.habits.length, wins, tiny, activeDays:days,
    focusSessions:S.focusCount, focusMins:S.focusMins, coachTotal:S.m.coachTotal, aiOnboard:S.m.aiOnboard,
    calClicks:S.m.calClicks, roomJoins:S.m.roomJoins, hitLimit:S.m.hitLimit, plus:S.plus, upgradedAt:S.m.upgradedAt, level:level().lvl};
}
async function writeStats(){
  if(!statsRef) return;
  const d=statsDoc(), j=JSON.stringify(d); if(j===lastStats) return;
  try{ await statsRef.set(d); lastStats=j; }catch(e){ if(e&&e.code!=="unavailable") statsRef=null; }
}
async function initStorage(){
  loadLocal();
  const fallback=setTimeout(()=>{ if(!ready){ ready=true; render(); } },4000);
  try{
    if(window.claude&&window.claude.use){
      [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
      if(user){ try{ isOwner=await user.isOwner(); }catch(e){ isOwner=false; } }
      const id=(db&&user)?await user.id():null;
      if(id){
        const ref=db.doc("data/users/"+id+"/footholds");
        const snap=await ref.get();
        docRef=ref; storeMode="db"; statsRef=db.doc("stats/"+id);
        if(snap.exists&&!localDirty){ S=JSON.parse(JSON.stringify(snap.data()||{})); normalize(); }
        await flush();
        if(storeMode==="db"){ try{ localStorage.removeItem(LS_KEY); }catch(e){} }
      }
    }
  }catch(e){ storeMode="local"; docRef=null; }
  clearTimeout(fallback); ready=true; applyTheme(); render();
}
async function initSample(){ try{ if(window.claude&&window.claude.use){ sample=await claude.use("sample"); render(); } }catch(e){ sample=null; } }

// ================= logic =================
const status=(hid,dk)=>(S.logs[dk]||{})[hid]||null;
function setStatus(hid,dk,v){ S.logs[dk]=Object.assign({},S.logs[dk]||{}); if(v) S.logs[dk][hid]=v; else delete S.logs[dk][hid]; save(); }
function history(h,n){
  const out=[],graceUsed={},created=h.created||S.created;
  for(let i=n-1;i>=0;i--){
    const d=daysAgo(i),dk=keyOf(d); let st=status(h.id,dk);
    if(!st&&i>0&&S.plus&&dk>=created){ const wk=weekKey(d); if((graceUsed[wk]||0)<2){ graceUsed[wk]=(graceUsed[wk]||0)+1; st="grace"; } }
    out.push({dk,st,before:dk<created});
  }
  return out;
}
function streak(h){ const hist=history(h,120).reverse(); let s=0; for(let i=0;i<hist.length;i++){ const x=hist[i]; if(i===0&&!x.st) continue; if(x.before) break; if(x.st) s++; else break; } return s; }
function rate(h,n){ const hist=history(h,n).filter(x=>!x.before); if(!hist.length) return 0; return Math.round(100*hist.filter(x=>x.st==="full"||x.st==="tiny").length/hist.length); }
function points(){ let p=0; for(const dk in S.logs) for(const hid in S.logs[dk]) p+=S.logs[dk][hid]==="full"?PTS.full:PTS.tiny; return p+S.focusCount*PTS.focus; }
function level(){ const p=points(); return {pts:p, lvl:Math.floor(p/PER_LEVEL)+1, into:p%PER_LEVEL}; }
const unlocked=u=>S.plus||level().lvl>=u.lvl;
const funEmojiOn=()=>unlocked(UNLOCKS.find(u=>u.id==="fun"));
function applyTheme(){ const u=UNLOCKS.find(x=>x.id===S.theme); const id=(u&&unlocked(u))?S.theme:"classic"; if(id==="classic") document.documentElement.removeAttribute("data-palette"); else document.documentElement.setAttribute("data-palette",id); }
let lastLevel=null;
function checkLevelUp(){
  const l=level().lvl;
  if(lastLevel!==null&&l>lastLevel){ const u=UNLOCKS.find(x=>x.lvl===l); setTimeout(()=>toast(`Level ${l}! 🎉`+(u&&!S.plus?` You unlocked ${u.label} ${u.em}`:"")),900); confetti($(".pill.lvl"),"var(--pop)"); }
  lastLevel=l;
}
const coachUses=()=>S.coach[weekKey(new Date())]||0;
function bumpCoach(){ const k=weekKey(new Date()); S.coach[k]=(S.coach[k]||0)+1; S.m.coachTotal++; save(); }
function canCoach(){ if(S.plus||coachUses()<FREE_COACH) return true; S.m.hitLimit=1; save(); return false; }
function summaryForAI(days){
  const lines=S.habits.map(h=>`- "${h.name}" (tiny version: "${h.tiny||"none"}", effort: ${EFFORT[h.energy]}, time: ${WHEN[h.when]}): `+history(h,days).filter(x=>!x.before).map(x=>x.st==="full"?"F":x.st==="tiny"?"T":x.st==="grace"?"G":"-").join(""));
  const en=[]; for(let i=days-1;i>=0;i--){ const e=S.energy[keyOf(daysAgo(i))]; en.push(e?["L","O","H"][e-1]:"?"); }
  return `Habit log for the last ${days} days, oldest first (F = full, T = tiny version, G = grace day, - = missed):\n${lines.join("\n")}\nDaily energy check-ins, same order (L = low, O = okay, H = high, ? = none): ${en.join("")}\nFocus sessions completed so far: ${S.focusCount}.`;
}
function aiErr(e){ const c=e&&e.code;
  if(c==="not_granted") return "Your buddy needs permission to chat. Reload and tap Allow when asked. 🙏";
  if(c==="rate_limited") return "Buddy’s a bit swamped. Give it a minute and try again.";
  return "Buddy blanked on that one (relatable). Try again in a sec."; }
function calLink(h){
  const t=h.time.split(":"); const d=new Date(); d.setHours(+t[0],+t[1],0,0); if(d<new Date()) d.setDate(d.getDate()+1);
  const end=new Date(d.getTime()+15*60000);
  const f=x=>x.getFullYear()+pad(x.getMonth()+1)+pad(x.getDate())+"T"+pad(x.getHours())+pad(x.getMinutes())+"00";
  const details=(h.tiny?`Tiny win if the brain says no: ${h.tiny}\n`:"")+(h.steps.length?`\nSteps:\n${h.steps.map((s,i)=>`${i+1}. ${s}`).join("\n")}\n`:"")+"\nLogged with Footholds 🪜";
  const p=new URLSearchParams({action:"TEMPLATE",text:`${h.emoji} ${h.name}`,dates:`${f(d)}/${f(end)}`,details,recur:"RRULE:FREQ=DAILY",ctz:Intl.DateTimeFormat().resolvedOptions().timeZone||"UTC"});
  return "https://calendar.google.com/calendar/render?"+p.toString();
}
const fmtTime=t=>{ const [H,M]=t.split(":").map(Number); const d=new Date(); d.setHours(H,M); return d.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"}); };
const fmtMS=ms=>{ const s=Math.max(0,Math.ceil(ms/1000)); return Math.floor(s/60)+":"+pad(s%60); };

// ================= views =================
let tab="today";
const checkSvg='<svg viewBox="0 0 24 24" fill="none"><path d="M6 12.5l4 4L18 8" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const hc=h=>`--hc:var(--c-${h.color})`;
const VIEWS={};
function render(){
  document.querySelectorAll("nav.tabs button").forEach(b=>{ if(b.dataset.tab===tab) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current"); });
  const L=level();
  const head=`<div class="top"><div class="brand"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span><span>Footholds</span></div>
    <div class="top-right">${isOwner?'<button class="pill" data-go="founder" aria-label="Founder dashboard">📊</button>':""}
    <button class="pill lvl" data-go="progress">Lv ${L.lvl}</button>
    <button class="pill ${S.plus?"plus":""}" data-go="plans">${S.plus?"⭐ Plus":"Free"}</button></div></div>`;
  $("#app").innerHTML=head+(ready?(VIEWS[tab]||VIEWS.today)():'<p class="muted">Warming up…</p>');
  if(tab==="focus"){ updateTimer(); renderPeers(); }
  if(tab==="founder") renderEcon();
}
function greeting(){ const h=new Date().getHours(); return h<5?"Hey, night owl 🦉":h<12?"Morning, legend ☀️":h<18?"Afternoon, superstar ✨":"Evening, you champ 🌙"; }

VIEWS.today=function(){
  const dk=today(), en=S.energy[dk];
  let html=`<div class="hero"><h1>${greeting()}</h1><p class="muted">${esc(new Date().toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"}))}</p>`;
  if(S.habits.length){
    const done=S.habits.filter(h=>status(h.id,dk)).length, all=done===S.habits.length;
    const msg=done===0?"Battery’s empty. Let’s charge it.":all?"Fully charged. You did the thing! 🎉":done/S.habits.length>=.5?"Over halfway. Look at you go.":"Charging up. Every win counts.";
    html+=`<div class="battery ${all?"all":""}"><div class="battery-top"><span class="battery-count">${done}/${S.habits.length} wins</span><span class="small muted">${msg}</span></div>
      <div class="cells" aria-hidden="true">${S.habits.map(h=>`<div class="cell ${status(h.id,dk)||""}"><i style="background:var(--c-${h.color})"></i></div>`).join("")}</div></div>`;
  }
  html+=`</div><section class="energy" aria-labelledby="enq"><h3 id="enq">How’s the brain battery?</h3>
    <p class="small muted" style="margin-top:2px">No wrong answer. We’ll shuffle your list to match.</p>
    <div class="energy-row">${[1,2,3].map(l=>`<button class="energy-btn" data-energy="${l}" aria-pressed="${en==l}"><span class="em" aria-hidden="true">${ENERGY[l].em}</span>${ENERGY[l].label}</button>`).join("")}</div></section>`;
  if(!S.habits.length){

function patterns(){

  return {byEnergy,best:bi<0||bv<=0?"Still gathering clues. Keep logging for a week or two. 🔍":`${names[bi]} are your thing – you hit ${Math.round(bv*100)}% of your habits. 💪`};
}

function updateTimer(){

// Room: presence only carries a fun nickname, an animal emoji, an optional task label, and an end time.
let focusRoom=null, roomTried=false, peersCache=[];
async function joinRoom(){
  if(roomTried) return; roomTried=true;
  try{
    roomApi=await claude.use("room"); if(!roomApi){ peersFail(); return; }
    focusRoom=await roomApi.join("focus");
    S.m.roomJoins++; save();
    focusRoom.onPeers(ch=>{ peersCache=ch.peers; renderPeers(); }, ()=>peersFail());
    focusRoom.on("cheer", msg=>{ const d=msg.data||{}; if(msg.isMe&&msg.sameTab) return;
      let me=null; try{ me=focusRoom.peers().find(p=>p.sameTab); }catch(e){}
      if(me&&d.to===me.peer){ const from=peersCache.find(p=>p.peer===msg.peer); const n=from?cleanPresence(from.presence).nick:"Someone"; toast(`${n} cheered you on 👏`); }
    }, ()=>{});
    setPresence();
  }catch(e){ peersFail(); }
}
function peersFail(){ const el=$("#peerList"); if(el) el.innerHTML='<p class="small muted">The focus room isn’t available here. Open Footholds from its claude.ai link while signed in to join.</p>'; focusRoom=null; }
function setPresence(){
  if(!focusRoom) return;
  const h=S.habits.find(x=>x.id===T.habitId);
  focusRoom.presence({nick:S.nick,em:S.nickEm,state:T.running?"focus":(T.paused?"paused":"here"),endsAt:T.running?T.endsAt:null,
    task:(S.shareTask&&(T.running||T.paused))?(h?h.name.slice(0,40):"Free focus"):null}).catch(()=>{});
}
function cleanPresence(p){ p=p||{}; const now=Date.now();
  return {nick:str(p.nick,24)||"Mystery guest", em:ANIMAL_EM.includes(p.em)?p.em:"🙂", state:["focus","paused","here"].includes(p.state)?p.state:"here",
    endsAt:(Number.isFinite(p.endsAt)&&p.endsAt>now&&p.endsAt<now+3*3600000)?p.endsAt:null, task:str(p.task,40)}; }
function renderPeers(){
  const el=$("#peerList"); if(!el) return;
  if(!focusRoom){ if(roomTried&&!roomApi) peersFail(); return; }
  const list=peersCache.filter(p=>p.kind==="viewer");
  if(!list.length){ el.innerHTML='<p class="small muted">Just you so far. Share the link and focus together. 💜</p>'; return; }
  const sorted=list.slice().sort((a,b)=>(cleanPresence(b.presence).state==="focus")-(cleanPresence(a.presence).state==="focus"));
  const focusing=sorted.filter(p=>cleanPresence(p.presence).state==="focus").length;
  el.innerHTML=`<p class="small"><b>${focusing}</b> focusing · <b>${list.length}</b> here</p>`+sorted.map(p=>{ const c=cleanPresence(p.presence), me=p.sameTab;
    const status=c.state==="focus"?(c.endsAt?`Focusing · ${Math.max(1,Math.ceil((c.endsAt-Date.now())/60000))} min left`:"Focusing"):c.state==="paused"?"Taking a breather":"Hanging out";
    return `<div class="peer"><span class="pe" aria-hidden="true">${c.em}</span><div class="pinfo"><div class="peer-name">${esc(c.nick)}${me?" (you)":""}${p.guest?' <span class="small muted">guest</span>':""}</div>
      <div class="peer-task">${esc(status)}${c.task?" · "+esc(c.task):""}</div></div>${me?"":`<button class="cheer-btn" data-cheer="${esc(p.peer)}" aria-label="Cheer ${esc(c.nick)} on">👏</button>`}</div>`; }).join("");
}

function renderEcon(){

  el.innerHTML=`<div class="econ-out"><div><b>$${mrr.toFixed(2)}</b><span>monthly revenue</span></div><div><b>$${ai.toFixed(2)}</b><span>AI cost</span></div><div><b>${mrr?margin+"%":"–"}</b><span>gross margin</span></div></div>

}

}
